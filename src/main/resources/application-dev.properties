# SwaggerUI URL: http://localhost:8080/q/swagger-ui/
# Keycloak URL: http://localhost:8088

# Keycloak Configuration
quarkus.keycloak.devservices.realm-path=blog-realm.json
quarkus.keycloak.devservices.realm-name=blog
quarkus.keycloak.devservices.port=8088

# Blog DB
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.reuse=false

# Kafka outgoing configuration
mp.messaging.outgoing.validation-request.connector=smallrye-kafka
mp.messaging.outgoing.validation-request.topic=validation-request
mp.messaging.outgoing.validation-request.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

# Kafka incoming configuration
mp.messaging.incoming.validation-response.auto.offset.reset=earliest
mp.messaging.incoming.validation-response.connector=smallrye-kafka
mp.messaging.incoming.validation-response.topic=validation-response
mp.messaging.incoming.validation-response.value.deserializer=ch.hftm.blog.model.domain.ValidationResponseDeserializer

kafka.bootstrap.servers=localhost:9092