# Docker compose file to run the blog rest api service and all added services / projects from hftm courses 'IN306 Verteilte Systeme' and 'IN311 XML-Verarbeitung'
# To configure prometheus, take a look at the prometheus.yaml file in the config folder.

services:

  # Redpanda kafka messaging broker service container
  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: redpanda-broker
    command:
      - redpanda
      - start
      - --advertise-kafka-addr
      - redpanda-broker:9092
    ports:
      - "9092:9092"
    networks:
      - blog-nw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus time series database container for metrics persistence
  prometheus:
    image: prom/prometheus
    container_name: prometheus-monitoring-db
    ports:
      - "9090:9090"
    networks:
      - blog-nw
    volumes:
      - "./config/prometheus.yaml:/etc/prometheus/prometheus.yaml"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    restart: unless-stopped

  # Grafana metrics dashboard webapp container
  grafana:
    image: grafana/grafana
    container_name: grafana-monitoring
    ports:
      - "3000:3000"
    networks:
      - blog-nw
    volumes:
      - grafana_vol:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MySQL database container for keycloak persistence
  keycloak-mysql:
    image: mysql:8.0
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: vs4tw
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbuser
      MYSQL_DATABASE: keycloakdb
    ports:
      - "3306:3306"
    volumes:
      - keycloak-db:/var/lib/mysql
    networks:
      - blog-nw
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # MySQL database container for blog persistence
  blog-mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: vs4tw
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbuser
      MYSQL_DATABASE: blogdb
    ports:
      - "3406:3306"
    volumes:
      - blog-db:/var/lib/mysql
    networks:
      - blog-nw
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Keycloak authentication service container
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak-auth-service
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_URL: http://keycloak:8180
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql:3306/keycloakdb
      KC_DB_USERNAME: dbuser
      KC_DB_PASSWORD: dbuser
    ports:
      - "8180:8180"
    volumes:
      - ./src/main/resources/blog-realm.json:/opt/keycloak/data/import/blog-realm.json
    networks:
      - blog-nw
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    command: start-dev --import-realm
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://keycloak:8180" ]
      interval: 20s
      timeout: 10s
      retries: 10

  # Quarkus blog api service container
  blog_api_service:
    image: ghcr.io/getwombats/blog-rest-service:latest
    container_name: blog-api-service
    ports:
      - "8080:8080"
    networks:
      - blog-nw
    depends_on:
      blog-mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Quarkus blog messaging validation service container
  blog-validation-service:
    image: ghcr.io/getwombats/blog-content-validation-service:latest
    container_name: blog-validation-service
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda-broker:9092
    networks:
      - blog-nw

# Docker network in which the containers are added to
networks:
  blog-nw:
    driver: bridge

# Docker container volumes to map data
volumes:
  grafana_vol:
  keycloak-db:
  blog-db:
